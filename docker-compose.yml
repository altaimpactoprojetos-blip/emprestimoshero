services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emprestimoshero
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/emprestimoshero?schema=public
      PORT: 4000
    command: sh -c "npx prisma migrate deploy && node dist/src/server.js"
    volumes:
      - storage:/app/apps/api/storage
      - backups:/app/apps/api/backups
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/emprestimoshero?schema=public
    command: node dist/src/worker.js
    volumes:
      - storage:/app/apps/api/storage
      - backups:/app/apps/api/backups
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  dbdata:
  storage:
  backups:
